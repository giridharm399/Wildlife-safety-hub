<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Guardian</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🌳 Forest Guardian AI</h1>
        <p>Intelligent Wildlife & Forest Safety Management</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>Choose Dashboard</h2>
            <p>Select the dashboard based on your role.</p>

            <br>

            <button onclick="openDashboard('department')">
                🏢 Forest Department
            </button>

            <button onclick="openDashboard('ranger')">
                🧭 Ranger
            </button>

            <button onclick="openDashboard('tourist')">
                🦌 Tourist
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
